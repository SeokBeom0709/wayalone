# ---- 배포(prod) 설정: MySQL, 값은 모두 환경변수로 주입 ----
# 예) DB_URL=jdbc:mysql://<host>:3306/honhaeng?useSSL=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 마이그레이션 도구(Flyway 등) 도입 전까지는 update 사용. 도입 후 validate 로 바꾸세요.
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=false

# 문자 인증: 실제 발송만 허용하고, 인증번호를 응답에 절대 담지 않습니다.
app.sms.provider=${SMS_PROVIDER:solapi}
app.sms.expose-dev-code=false
app.phone.pepper=${PHONE_PEPPER}

# 관리자 계정: 기본값 없이 환경변수로만 받습니다.
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}

# 실제 서비스에는 샘플 데이터를 넣지 않습니다.
app.seed.enabled=false

# 웹/앱이 접속하는 출처만 허용. 예) CORS_ORIGINS=https://honhaeng.example.com,capacitor://localhost,https://localhost
app.cors.allowed-origins=${CORS_ORIGINS:}

# 프록시(로드밸런서) 뒤에서 https 정보를 올바르게 인식
server.forward-headers-strategy=framework
