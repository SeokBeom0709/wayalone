spring.application.name=honhaeng

# ---- 개발(기본) 설정: 로컬 파일 H2 ----
spring.datasource.url=jdbc:h2:file:./data/honhaeng;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
# H2 콘솔은 기본 꺼짐. 필요할 때만 H2_CONSOLE=true 로 실행하세요.
spring.h2.console.enabled=${H2_CONSOLE:false}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

server.port=${PORT:8080}

# 샘플 데이터(장소/후기/동행 글) 자동 입력 여부
app.seed.enabled=true
# CORS 허용 출처 (쉼표로 구분). 개발에서는 전체 허용
app.cors.allowed-origins=*

# 카카오 로컬 API REST 키 (주변 식당 검색). 환경변수 KAKAO_REST_KEY 로 주입하세요.
kakao.rest-key=${KAKAO_REST_KEY:}

# ---- 휴대폰 문자 인증 ----
# log: 문자를 보내지 않고 서버 로그에 남김(개발용) / solapi: 솔라피로 실제 발송
app.sms.provider=${SMS_PROVIDER:log}
# 개발용 발송기일 때만, 화면에서 테스트할 수 있도록 인증번호를 응답에 담아 보여 줍니다.
app.sms.expose-dev-code=true
app.sms.from=${SMS_FROM:}
app.sms.solapi.api-key=${SOLAPI_API_KEY:}
app.sms.solapi.api-secret=${SOLAPI_API_SECRET:}
app.sms.ip-hourly-limit=30
# 휴대폰 번호 HMAC 용 비밀값. 배포 환경에서는 반드시 PHONE_PEPPER 로 바꾸세요.
app.phone.pepper=${PHONE_PEPPER:dev-only-phone-pepper}

# ---- 관리자 계정 (시작할 때 없으면 만들고, 있으면 관리자로 승격) ----
# 개발용 기본값입니다. 배포 환경에서는 ADMIN_EMAIL / ADMIN_PASSWORD 로 바꾸세요.
app.admin.email=${ADMIN_EMAIL:admin@wayalone.test}
app.admin.password=${ADMIN_PASSWORD:Admin1234!}

# 로그인 기록(IP 포함) 보관 기간. 지나면 매일 새벽 4시 30분에 삭제합니다.
app.log.login-retention-days=365

# 상태 확인용 /actuator/health 만 노출
management.endpoints.web.exposure.include=health
